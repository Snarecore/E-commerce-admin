<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Fashion Time Admin</title>
	<script>
		/* Pre-hydrate appearance tokens immediately before HTML parse to guarantee 0ms FOUC */
		(function () {
			try {
				var raw = localStorage.getItem('bazaarbound-appearance');
				if (raw) {
					var state = JSON.parse(raw);
					if (state.themeId) document.documentElement.dataset.theme = state.themeId;
					var isDark = false;
					if (state.overrides) {
						if (state.overrides.accent) {
							document.documentElement.style.setProperty('--primary-color', state.overrides.accent);
							document.documentElement.style.setProperty('--color-primary', state.overrides.accent);
						}
						if (state.overrides.density) document.documentElement.dataset.density = state.overrides.density;
						if (state.overrides.fieldStyle) document.documentElement.dataset.fieldStyle = state.overrides.fieldStyle;
						if (state.overrides.sidebarCollapse === 'collapsed') {
							document.documentElement.style.setProperty('--ui-sidebar-width', '68px');
							document.documentElement.dataset.sidebarCollapse = 'collapsed';
						}
						if (state.overrides.colorMode === 'dark') isDark = true;
						else if (state.overrides.colorMode === 'system') {
							isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
						}
					}
					if (state.themeId === 'graphite-dark') isDark = true;
					if (isDark) {
						document.documentElement.classList.add('dark');
						document.documentElement.dataset.resolvedMode = 'dark';
					}
				}
			} catch (_) {}
		})();
	</script>
</head>

<body>
	<div id="root"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
